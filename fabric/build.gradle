plugins { id 'com.github.johnrengelman.shadow' }
architectury { platformSetupLoomIde(); fabric() }
configurations {
 common { canBeResolved = true; canBeConsumed = false }
 compileClasspath.extendsFrom common
 runtimeClasspath.extendsFrom common
 developmentFabric.extendsFrom common
 shadowBundle { canBeResolved = true; canBeConsumed = false }
}
dependencies {
 modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
 modImplementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
 modImplementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
 common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
 shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
 // Loom remaps the real intermediary production mod for the named dev runtime.
 modRuntimeOnly files(rootProject.thaumcraftProductionJar('fabric'))
}
processResources {
 inputs.property 'version', project.version
 filesMatching('fabric.mod.json') { expand version: project.version }
}
shadowJar { configurations = [project.configurations.shadowBundle]; archiveClassifier = 'dev-shadow' }
remapJar { inputFile.set shadowJar.archiveFile }
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
 dependsOn rootProject.tasks.named('verifyThaumcraftInputs')
}
sourceSets {
 gameTest {
  compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath + project(':common').sourceSets.gameTest.output
  runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + project(':common').sourceSets.gameTest.output
 }
}
def gameTestRoots = files(sourceSets.gameTest.output, project(':common').sourceSets.gameTest.output)
loom.runs {
 gameTest {
  server()
  source sourceSets.gameTest
  vmArg '-Xmx2G'
  vmArg '-Dfabric-api.gametest=true'
  vmArg "-Dfabric.classPathGroups=${gameTestRoots.files.collect { it.absolutePath }.join(File.pathSeparator)}"
  vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.file('gametest-results.xml').get().asFile.absolutePath}"
  runDir 'run-gametest'
 }
}
tasks.named('runGameTest') {
 dependsOn tasks.named('gameTestClasses'), project(':common').tasks.named('gameTestClasses')
}
apply from: rootProject.file('gradle/addon-isolation.gradle')
