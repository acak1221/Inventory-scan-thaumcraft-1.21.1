plugins {
 id 'dev.architectury.loom' version '1.11.458' apply false
 id 'architectury-plugin' version '3.4.162'
 id 'com.github.johnrengelman.shadow' version '8.1.1' apply false
}
architectury { minecraft = minecraft_version }
allprojects { group = rootProject.maven_group; version = rootProject.mod_version }
ext.thaumcraftHome = file(providers.gradleProperty('thaumcraft_home').get())
ext.thaumcraftNamedJar = new File(thaumcraftHome, providers.gradleProperty('thaumcraft_common_jar').get())
ext.thaumcraftProductionJar = { String loader ->
 new File(thaumcraftHome, providers.gradleProperty("thaumcraft_${loader}_jar").get())
}
tasks.register('verifyThaumcraftInputs') {
 group = 'verification'
 description = 'Check the external mapped API and exact supported runtime Thaumcraft archives.'
 doLast {
  if (!thaumcraftNamedJar.isFile()) throw new GradleException("Missing mapped Thaumcraft API: $thaumcraftNamedJar")
  ['fabric', 'neoforge'].each { loader ->
   def jar = thaumcraftProductionJar(loader)
   if (!jar.isFile()) throw new GradleException("Missing external Thaumcraft $loader runtime: $jar")
   def sha = java.security.MessageDigest.getInstance('SHA-256').digest(jar.bytes).encodeHex().toString()
   if (sha != providers.gradleProperty("thaumcraft_${loader}_sha256").get()) {
    throw new GradleException("Thaumcraft $loader runtime differs from the supported 0.1.0-alpha.7 archive: $jar")
   }
  }
 }
}
subprojects {
 apply plugin: 'dev.architectury.loom'
 apply plugin: 'architectury-plugin'
 base { archivesName = rootProject.archives_name + '-' + project.name }
 repositories {
  mavenCentral()
  maven { url = 'https://maven.architectury.dev/' }
  maven { url = 'https://maven.fabricmc.net/' }
  maven { url = 'https://maven.neoforged.net/releases/' }
 }
 dependencies {
  minecraft "com.mojang:minecraft:$rootProject.minecraft_version"
  mappings loom.officialMojangMappings()
  // Already in Mojang's named namespace: do not remap or bundle this API input.
  compileOnly files(rootProject.thaumcraftNamedJar)
 }
 java { toolchain { languageVersion = JavaLanguageVersion.of(21) }; withSourcesJar() }
 tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
  options.release = 21
  dependsOn rootProject.tasks.named('verifyThaumcraftInputs')
 }
 tasks.withType(Test).configureEach { useJUnitPlatform() }
}
tasks.register('build') { group = 'build'; dependsOn ':common:build', ':fabric:build', ':neoforge:build' }
